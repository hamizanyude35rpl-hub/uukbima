<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip Gaji Karyawan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Slip Gaji Karyawan</h1>

    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan nama karyawan" required><br><br>

    <label for="gajiPokok">Gaji Pokok:</label>
    <input type="number" id="gajiPokok" placeholder="Gaji pokok karyawan" required><br><br>

    <label for="jamLembur">Jam Lembur:</label>
    <input type="number" id="jamLembur" placeholder="Masukkan jumlah jam" required><br><br>

    <label for="hariAbsen">Hari Absen:</label>
    <input type="number" id="hariAbsen" placeholder="Masukkan jumlah hari" required><br><br>

    <button id="btnHitung">Hitung Gaji</button>
    <p id="hasilGaji"></p>

    <script src="soal1.js"></script>
</body>
</html>
