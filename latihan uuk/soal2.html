<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Upah Pekerja</title>
</head>
<body>
    <h1>Rekap Upah Pekerja Harian</h1>

    <label for="pekerja">Nama Pekerja:</label>
    <input type="text" id="pekerja" placeholder="Masukkan nama pekerja" required><br><br>

    <label for="jamKerja">Jam Kerja:</label>
    <input type="number" id="jamKerja" min="0" placeholder="Masukkan jumlah jam" required><br><br>

    <label for="upahJam">Upah per Jam:</label>
    <input type="number" id="upahJam" min="0" placeholder="Masukkan upah per jam" required><br><br>

    <button id="btnSimpan">Simpan</button>
    <button id="btnReset" type="button">Reset</button>
    <div id="hasil"></div>

    <script src="soal2.js"></script>
</body>
</html>
